# Config Netlify pour Hostmate_vitrine.
#
# DOMAINE : le site passe sur hostmateai.app (orthographe exacte). L'ancien
# hosmateai.com — sans le "t" de host — reste utilise pour l'ENVOI D'EMAILS
# uniquement : sa reputation d'expediteur est deja construite, et en changer
# ferait partir les messages en indesirables le temps de la refaire.
# A faire cote Netlify (dashboard, pas ici) :
#   - Domain settings -> ajouter hostmateai.app comme domaine principal
#   - Garder hosmateai.com en alias avec redirection, pour les liens deja
#     partages et le referencement acquis.
#
# SPA classique (Vite + react-router) : sans le catch-all ci-dessous, recharger
# une URL en prod renvoie un 404 Netlify au lieu de laisser react-router gerer
# la route cote client.

# La liste d'attente a ete retiree (passage en production). L'URL ayant deja
# ete partagee, on redirige au lieu de renvoyer une 404.
[[redirects]]
  from = "/waitlist"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
