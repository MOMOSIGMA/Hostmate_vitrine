# Config Netlify pour Hostmate_vitrine.
#
# DOMAINE : le site passe sur hostmateai.app (orthographe exacte). L'ancien
# hosmateai.com — sans le "t" de host — reste utilise pour l'ENVOI D'EMAILS
# uniquement : sa reputation d'expediteur est deja construite, et en changer
# ferait partir les messages en indesirables le temps de la refaire.
# A faire cote Netlify (dashboard, pas ici) :
#   - Domain settings -> ajouter hostmateai.app comme domaine principal
#   - Garder hosmateai.com en alias avec redirection, pour les liens deja
#     partages et le referencement acquis.
#
# SPA classique (Vite + react-router) : sans le catch-all ci-dessous, recharger
# une URL en prod renvoie un 404 Netlify au lieu de laisser react-router gerer
# la route cote client.

# ─── LA COMMANDE DE BUILD EST ECRITE ICI, PAS DANS LE TABLEAU DE BORD ───────
# Ajoutee le 16/08/2026. Elle etait definie uniquement cote Netlify, donc
# invisible depuis le depot : impossible de savoir en lisant le code si le blog
# serait genere ou non.
#
# `npm run build` enchaine trois choses — tsc, vite, puis
# scripts/generer-blog.mjs qui produit les pages HTML du blog. Si quelqu'un
# reglait la commande sur `vite build` dans l'interface, le site continuerait
# de se deployer normalement et le blog cesserait simplement d'exister, sans
# erreur ni alerte.
#
# Ce fichier a priorite sur le tableau de bord : la question ne se pose plus.
[build]
  command = "npm run build"
  publish = "dist"

# La liste d'attente a ete retiree (passage en production). L'URL ayant deja
# ete partagee, on redirige au lieu de renvoyer une 404.
[[redirects]]
  from = "/waitlist"
  to = "/"
  status = 301
  force = true

# ⚠️ NE JAMAIS AJOUTER force = true SUR CETTE RÈGLE (13/08/2026).
#
# Netlify n'applique une redirection que si le chemin demandé ne correspond à
# AUCUN fichier réel — sauf avec `force = true`, qui la fait passer avant tout.
#
# Le blog (/blog/…) est fait de vraies pages HTML, générées au build par
# scripts/generer-blog.mjs. Elles existent sur le disque, donc elles sont
# servies avant d'atteindre cette règle. C'est exactement ce qu'on veut : ce
# sont ces fichiers, et eux seuls, que Google et les moteurs IA peuvent lire —
# l'application React ne livre aucun texte sans JavaScript.
#
# Mettre `force = true` ici renverrait /blog/mon-article vers la coquille vide
# du SPA. Le site continuerait de fonctionner à l'œil nu ; seul le
# référencement mourrait, sans erreur, sans alerte, et sans que personne ne
# fasse le lien avec cette ligne.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
